<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #e8f5e9;
            background: radial-gradient(circle at top, #1b3a2a, #0b1510);
        }

        .game {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 18px;
            background: #12241b;
            border: 2px solid #2f6b4a;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #7CFC9A;
            letter-spacing: 1px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .score-box {
            flex: 1;
            padding: 8px 12px;
            text-align: center;
            font-weight: 700;
            background: #1b3a2a;
            border-radius: 10px;
        }

        .score-box span {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #9ccfb0;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            background: #0e1c15;
            border: 3px solid #2f6b4a;
            border-radius: 12px;
            touch-action: none;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            font: inherit;
            font-weight: 700;
            color: #0b1510;
            background: #7CFC9A;
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: #a4ffba;
            transform: translateY(-2px);
        }

        .actions button {
            flex: 1;
        }

        .dpad {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dpad-row {
            display: flex;
            gap: 8px;
        }

        .dpad button {
            width: 62px;
            height: 52px;
            font-size: 1.3rem;
        }

        .hint {
            text-align: center;
            font-size: 0.85rem;
            color: #9ccfb0;
        }

        @media (hover: none), (max-width: 600px) {
            .dpad {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="game">
        <h1>🐍 Snake</h1>

        <div class="scoreboard">
            <div class="score-box"><span>SCORE</span><b id="score">0</b></div>
            <div class="score-box"><span>BEST</span><b id="best">0</b></div>
        </div>

        <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>

        <div class="actions">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
        </div>

        <div class="dpad" aria-label="On-screen controls">
            <div class="dpad-row"><button data-dir="up">↑</button></div>
            <div class="dpad-row">
                <button data-dir="left">←</button>
                <button data-dir="down">↓</button>
                <button data-dir="right">→</button>
            </div>
        </div>

        <p class="hint">Arrow keys or WASD to move · Space to pause · Swipe on mobile</p>
    </div>

    <script>
        const canvas = document.getElementById("board");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");

        const CELLS = 20;
        const SIZE = canvas.width / CELLS;

        const DIRS = {
            up:    { x: 0,  y: -1 },
            down:  { x: 0,  y: 1 },
            left:  { x: -1, y: 0 },
            right: { x: 1,  y: 0 }
        };

        let snake, dir, queue, food, score, best = 0;
        let timer = null;
        let state = "ready"; // ready | running | paused | over

        try {
            best = Number(localStorage.getItem("snakeBest")) || 0;
        } catch (e) {}
        bestEl.textContent = best;

        function reset() {
            snake = [
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            dir = DIRS.right;
            queue = [];
            score = 0;
            scoreEl.textContent = 0;
            placeFood();
        }

        function placeFood() {
            const free = [];
            for (let x = 0; x < CELLS; x++) {
                for (let y = 0; y < CELLS; y++) {
                    if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
                }
            }
            food = free[Math.floor(Math.random() * free.length)];
        }

        function speed() {
            return Math.max(60, 140 - Math.floor(score / 10) * 6);
        }

        function schedule() {
            clearTimeout(timer);
            timer = setTimeout(tick, speed());
        }

        function start() {
            reset();
            state = "running";
            startBtn.textContent = "Restart";
            pauseBtn.textContent = "Pause";
            draw();
            schedule();
        }

        function togglePause() {
            if (state === "running") {
                state = "paused";
                clearTimeout(timer);
                pauseBtn.textContent = "Resume";
            } else if (state === "paused") {
                state = "running";
                pauseBtn.textContent = "Pause";
                schedule();
            }
            draw();
        }

        function setDirection(name) {
            if (state === "ready" || state === "over") {
                start();
            }
            if (state !== "running") return;

            const next = DIRS[name];
            const last = queue.length ? queue[queue.length - 1] : dir;
            // Ignore reversing straight into yourself and repeated input
            if (next.x === -last.x && next.y === -last.y) return;
            if (next.x === last.x && next.y === last.y) return;
            if (queue.length < 3) queue.push(next);
        }

        function tick() {
            if (state !== "running") return;

            if (queue.length) dir = queue.shift();

            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            const ate = head.x === food.x && head.y === food.y;
            const body = ate ? snake : snake.slice(0, -1);

            const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
            const hitSelf = body.some(s => s.x === head.x && s.y === head.y);

            if (hitWall || hitSelf) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (ate) {
                score += 10;
                scoreEl.textContent = score;
                if (snake.length === CELLS * CELLS) {
                    gameOver(true);
                    return;
                }
                placeFood();
            } else {
                snake.pop();
            }

            draw();
            schedule();
        }

        function gameOver(won) {
            state = "over";
            clearTimeout(timer);
            if (score > best) {
                best = score;
                bestEl.textContent = best;
                try { localStorage.setItem("snakeBest", best); } catch (e) {}
            }
            startBtn.textContent = "Play Again";
            draw(won ? "You Win! 🏆" : "Game Over");
        }

        function roundRect(x, y, w, h, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fill();
        }

        function drawOverlay(title, subtitle) {
            ctx.fillStyle = "rgba(5, 15, 10, 0.72)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center";
            ctx.fillStyle = "#7CFC9A";
            ctx.font = "bold 38px Segoe UI, Arial, sans-serif";
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 6);
            ctx.fillStyle = "#cfeedd";
            ctx.font = "18px Segoe UI, Arial, sans-serif";
            ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 28);
        }

        function draw(overlayTitle) {
            // Checkerboard background
            for (let x = 0; x < CELLS; x++) {
                for (let y = 0; y < CELLS; y++) {
                    ctx.fillStyle = (x + y) % 2 === 0 ? "#0e1c15" : "#112219";
                    ctx.fillRect(x * SIZE, y * SIZE, SIZE, SIZE);
                }
            }

            if (!snake) {
                drawOverlay("Snake", "Press Start or any arrow key");
                return;
            }

            // Food
            ctx.fillStyle = "#ff5c5c";
            ctx.beginPath();
            ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Snake
            snake.forEach((s, i) => {
                const color = i === 0 ? "#b6ffc8" : (i % 2 ? "#4cd37a" : "#3cbf6a");
                roundRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2, 6, color);
            });

            // Eyes
            const h = snake[0];
            const cx = h.x * SIZE + SIZE / 2;
            const cy = h.y * SIZE + SIZE / 2;
            const px = dir.y !== 0 ? 4 : 0;
            const py = dir.x !== 0 ? 4 : 0;
            ctx.fillStyle = "#0b1510";
            [-1, 1].forEach(side => {
                ctx.beginPath();
                ctx.arc(cx + dir.x * 3 + side * px, cy + dir.y * 3 + side * py, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            if (state === "paused") drawOverlay("Paused", "Press Space to resume");
            if (state === "over") drawOverlay(overlayTitle || "Game Over", "Score: " + score + " · Press Enter to retry");
        }

        // Keyboard
        const KEYS = {
            ArrowUp: "up", w: "up", W: "up",
            ArrowDown: "down", s: "down", S: "down",
            ArrowLeft: "left", a: "left", A: "left",
            ArrowRight: "right", d: "right", D: "right"
        };

        document.addEventListener("keydown", e => {
            if (KEYS[e.key]) {
                e.preventDefault();
                setDirection(KEYS[e.key]);
            } else if (e.key === " ") {
                e.preventDefault();
                togglePause();
            } else if (e.key === "Enter" && (state === "over" || state === "ready")) {
                start();
            }
        });

        // Buttons
        startBtn.addEventListener("click", start);
        pauseBtn.addEventListener("click", togglePause);
        document.querySelectorAll(".dpad button").forEach(btn => {
            btn.addEventListener("click", () => setDirection(btn.dataset.dir));
        });

        // Swipe
        let touchStart = null;
        canvas.addEventListener("touchstart", e => {
            const t = e.touches[0];
            touchStart = { x: t.clientX, y: t.clientY };
        }, { passive: true });

        canvas.addEventListener("touchend", e => {
            if (!touchStart) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStart.x;
            const dy = t.clientY - touchStart.y;
            touchStart = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                setDirection(dx > 0 ? "right" : "left");
            } else {
                setDirection(dy > 0 ? "down" : "up");
            }
        });

        draw();
    </script>
</body>
</html>
